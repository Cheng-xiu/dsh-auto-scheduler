# dsh-auto-scheduler bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile web add github:Cheng-xiu/dsh-auto-scheduler`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (scheduler + /api/dsh-auto-scheduler/* routes + silent preset
# sync), and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client", served at /plugins/<id>/client.js) load in the GUI.
- insert:
    - id: auto-scheduler
      name: 'dsh-auto-scheduler'
